<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ 網球手鏈精算系統 / Tennis Bracelet Calculator ✦</title>
<style>
  :root {
    --bg-color: #F5F0EB;       
    --card-bg: #FFFFFF;        
    --primary-color: #8D7B68;  
    --secondary-color: #A4907C; 
    --text-main: #4A4036;      
    --text-light: #7E7468;     
    --border-color: #E6E2DD;   
    --highlight-bg: #F9F6F0;   
    --highlight-text: #8D7B68; 
  }

  body { font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; padding: 20px 15px; background-color: var(--bg-color); color: var(--text-main); margin: 0; }
  .container { max-width: 1050px; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(141, 123, 104, 0.15); margin: auto; }
  h2 { color: var(--primary-color); text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; font-size: 22px; margin-top: 0; }
  
  .reference-img-box { margin-bottom: 25px; background: #FCFAF8; padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); text-align: center; }
  
  .reference-img-box img { 
    width: 100%; 
    height: 120px; 
    object-fit: contain; 
    border-radius: 8px; 
    margin-top: 10px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
    background-color: #FFFFFF; 
  }

  .input-group { margin-bottom: 25px; background: #FCFAF8; padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); }
  
  label { display: block; margin-top: 15px; font-weight: bold; color: var(--primary-color); font-size: 15px; }
  label:first-child { margin-top: 0; }
  select, input { width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box; border: 1px solid var(--secondary-color); border-radius: 6px; font-size: 16px; font-family: inherit; color: var(--text-main); font-weight: bold; }
  select { background-color: var(--highlight-bg); cursor: pointer; }
  input:focus, select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 5px rgba(141, 123, 104, 0.3); }
  
  .table-responsive { overflow-x: auto; margin-top: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  table { width: 100%; border-collapse: collapse; min-width: 1100px; background-color: white; }
  th, td { border: 1px solid var(--border-color); padding: 14px 12px; text-align: center; font-size: 14.5px; }
  th { background-color: var(--secondary-color); color: white; font-weight: normal; }
  tr:nth-child(even) { background-color: #FAFAFA; }
  
  .highlight { font-weight: bold; color: var(--highlight-text); background-color: var(--highlight-bg) !important; }
  .en-text { font-size: 12px; opacity: 0.9; display: block; margin-top: 3px; font-weight: normal; }
  .sub-text { font-size: 12px; color: var(--text-light); font-weight: normal; display: block; margin-top: 4px; }
  .weight-unit { color: var(--primary-color); font-weight: bold; font-size: 13px; }

  /* 價格標籤專屬樣式 */
  .price-tag { color: #A04000; font-weight: bold; font-size: 13px; margin-top: 6px; background: #FDEBD0; padding: 4px 8px; border-radius: 4px; display: inline-block; border: 1px solid #F5CBA7; }
  .total-tag { color: #FFFFFF; font-weight: bold; font-size: 15px; margin-top: 4px; background: #D35400; padding: 5px 10px; border-radius: 6px; display: inline-block; box-shadow: 0 2px 5px rgba(211,84,0,0.3); letter-spacing: 0.5px; }
  .price-title { color: #C0392B; font-size: 16px; border-bottom: 2px solid #E6E2DD; padding-bottom: 8px; margin-bottom: 15px; font-weight: bold; }
  .fee-text { color: #2980B9; font-weight: bold; font-size: 13px; margin-top: 6px; display: inline-block; background: #EAF2F8; padding: 4px 8px; border-radius: 4px; margin-bottom: 2px; }
  
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
  .grid-3 label { margin-top: 0; } 
</style>
</head>
<body>
<div class="container">
  <h2>✦ 網球手鏈精算系統 ✦<br><span style="font-size:16px;">Tennis Bracelet Calculator (一鍵終極報價版)</span></h2>

  <!-- 價格設定區塊 -->
  <div class="input-group">
    <div class="price-title">💰 原料當日盤價設定</div>
    <div class="grid-3">
      <label>鑽石單價 <span class="en-text">(每克拉 / ct)</span>：
        <input type="number" id="diaPrice" step="100" value="15000" oninput="calcFromLength()">
      </label>
      <label>足金 (24K) 單價 <span class="en-text">(每克 / g)</span>：
        <input type="number" id="goldPrice" step="10" value="2600" oninput="calcFromLength()">
      </label>
      <label>足鉑 (PT999) 單價 <span class="en-text">(每克 / g)</span>：
        <input type="number" id="ptPrice" step="10" value="1100" oninput="calcFromLength()">
      </label>
    </div>
  </div>

  <div class="input-group" style="margin-top: 20px;">
    <label>選擇手鏈版型 <span class="en-text">(Select Bracelet Style)</span>
      <select id="modeSelect" onchange="loadDefault()">
        <option value="1pt">1分 滿鑽手鏈 / 0.01ct Tennis Bracelet</option>
        <option value="2pt">2分 滿鑽手鏈 / 0.02ct Tennis Bracelet</option>
        <option value="3pt">3分 滿鑽手鏈 / 0.03ct Tennis Bracelet</option>
        <option value="4pt">加密4分 滿鑽手鏈 / 0.04ct Tennis Bracelet</option>
        <option value="5pt">5分 滿鑽手鏈 / 0.05ct Tennis Bracelet</option>
        <option value="8pt">8分 滿鑽手鏈 / 0.08ct Tennis Bracelet</option>
        <option value="10pt">10分 滿鑽手鏈 / 0.10ct Tennis Bracelet</option>
        <option value="20pt">20分 滿鑽手鏈 / 0.20ct Tennis Bracelet</option>
      </select>
    </label>
    
    <label>目標總長度 <span class="en-text">(Target Length, cm) [輸入即自動精算]</span>
      <input type="number" id="tLen" step="0.01" oninput="calcFromLength()">
    </label>
  </div>

  <!-- 動態實品圖文對照區 -->
  <div class="reference-img-box" style="margin-bottom: 25px;">
    <span id="dynamicImgTitle" style="color: var(--primary-color); font-weight: bold; font-size: 14px;">實品款式參考</span>
    <img id="dynamicImg" src="" alt="實品圖">
  </div>

  <div class="table-responsive">
      <div id="result"></div>
  </div>
</div>

<script>
  const configs = {
    "1pt": { defaultLen: 16.08, cLen: 7.14, cWt: 0.585, cStones: 4, sLen: 1.7, sWt: 0.067, ctPerStone: 0.01 },
    "2pt": { defaultLen: 16.00, cLen: 7.93, cWt: 0.64, cStones: 4, sLen: 2.0, sWt: 0.073, ctPerStone: 0.02 },
    "3pt": { defaultLen: 16.17, cLen: 12.84, cWt: 1.01, cStones: 5, sLen: 2.2, sWt: 0.084, ctPerStone: 0.03 },
    "4pt": { defaultLen: 16.00, cLen: 10.4, cWt: 0.88, cStones: 4, sLen: 2.26, sWt: 0.10, ctPerStone: 0.04 },
    "5pt": { defaultLen: 16.37, cLen: 13.12, cWt: 1.22, cStones: 5, sLen: 2.5, sWt: 0.096, ctPerStone: 0.05 },
    "8pt": { defaultLen: 16.00, cLen: 15.5, cWt: 1.32, cStones: 5, sLen: 3.0, sWt: 0.14, ctPerStone: 0.08 },
    "10pt": { defaultLen: 19.51, cLen: 13.6, cWt: 4.24, cStones: 4, sLen: 3.3, sWt: 0.165, ctPerStone: 0.10 },
    "20pt": { defaultLen: 17.73, cLen: 20.13, cWt: 2.161, cStones: 5, sLen: 4.0, sWt: 0.25, ctPerStone: 0.20 }
  };
  
  const k14Ratio = 0.864;
  const ptRatio = 1.3;
  const gramToQian = 3.75; 
  
  // 成色、損耗與工費係數
  const purity18K = 0.755;
  const purity14K = 0.590;
  const purity10K = 0.417;
  const purityPT = 0.955;
  const lossMultiplier = 1.18;
  const baseProcessFee = 600; // 基礎公費
  const settingFeePerStone = 10; // 單顆鑲石工費

  function formatWeight(g) {
    let qianTotal = g / gramToQian;
    if (qianTotal >= 10) {
      let liang = Math.floor(qianTotal / 10);
      let qian = (qianTotal - (liang * 10)).toFixed(2);
      return `${liang}兩 ${qian}錢`;
    }
    return `${qianTotal.toFixed(2)} 錢`;
  }

  function updateDynamicImage(mode) {
    const titleEl = document.getElementById("dynamicImgTitle");
    const imgEl = document.getElementById("dynamicImg");

    if (mode === "1pt" || mode === "2pt") {
      titleEl.innerText = "實品款式參考 (1分與2分 滿鑽手鏈)";
      imgEl.src = "https://raw.githubusercontent.com/peter31love/-jewelry-calc-10045/2e8281e9b65064d7756bf22f865017a6d6e33a4b/80e08011-aa58-466b-aa71-a6cc7666a97f.png";
    } else if (mode === "3pt" || mode === "4pt") {
      titleEl.innerText = "實品款式參考 (3分與4分 滿鑽手鏈)";
      imgEl.src = "https://raw.githubusercontent.com/peter31love/-jewelry-calc-10045/c79307acba09bbd734576336013d24406dbc84d2/33.png";
    } else {
      titleEl.innerText = "實品款式參考 (5分以上 滿鑽手鏈)";
      imgEl.src = "https://raw.githubusercontent.com/peter31love/-jewelry-calc-10045/d234875912d79f4a6495ca9fc8bfe31e90a9ae06/777.bmp";
    }
  }

  function loadDefault() {
    let mode = document.getElementById('modeSelect').value;
    document.getElementById('tLen').value = configs[mode].defaultLen;
    calcFromLength();
  }

  function calcFromLength() {
    let mode = document.getElementById('modeSelect').value;
    let conf = configs[mode];
    let tLen_cm = parseFloat(document.getElementById('tLen').value) || 0;
    
    let diaPrice = parseFloat(document.getElementById('diaPrice').value) || 0;
    let goldPrice = parseFloat(document.getElementById('goldPrice').value) || 0;
    let ptPrice = parseFloat(document.getElementById('ptPrice').value) || 0;
    
    updateDynamicImage(mode);

    let actualSpace_mm = (tLen_cm * 10) - conf.cLen;
    let baseStones = Math.round(actualSpace_mm / conf.sLen);
    
    updateTable(baseStones, conf, diaPrice, goldPrice, ptPrice);
  }

  function updateTable(baseStones, conf, diaPrice, goldPrice, ptPrice) {
    let html = `<table>
      <tr>
        <th rowspan="2">總粒數與總工費<br><span class="en-text">Total Stones & Labor</span><br><span class="sub-text" style="color:#FFF;">(已含基礎公費 $${baseProcessFee})</span></th>
        <th rowspan="2" style="background-color:#BCAAA4;">總鑽重與成本<br><span class="en-text">Total Carat (ct)</span></th>
        <th rowspan="2">實際排版總長<br><span class="en-text">Actual Length (cm)</span></th>
        <th>18K金 淨重與總報價<br><span class="en-text">(料 + 鑽 + 工)</span></th>
        <th style="background-color:#D7CCC8; color:#4A4036;">14K金 淨重與總報價<br><span class="en-text">(料 + 鑽 + 工)</span></th>
        <th style="background-color:#E6D5C3; color:#4A4036;">10K金 淨重與總報價<br><span class="en-text">(料 + 鑽 + 工)</span></th>
        <th style="background-color:#9E9E9E;">PT950 淨重與總報價<br><span class="en-text">(料 + 鑽 + 工)</span></th>
      </tr>
      <tr>
        <th>(克 g / 錢/兩)</th>
        <th style="background-color:#D7CCC8; color:#4A4036;">(克 g / 錢/兩)</th>
        <th style="background-color:#E6D5C3; color:#4A4036;">(克 g / 錢/兩)</th>
        <th style="background-color:#9E9E9E;">(克 g / 錢/兩)</th>
      </tr>`;

    let mainStones = baseStones;
    let totalStones = mainStones + conf.cStones;
    let len_mm = conf.cLen + (mainStones * conf.sLen);
    let len_cm = len_mm / 10;
    
    // 鑽石與工費 (自動加上基礎公費)
    let totalCt = totalStones * conf.ctPerStone;
    let diaCost = totalCt * diaPrice;
    let settingFee = totalStones * settingFeePerStone;
    let totalLaborCost = settingFee + baseProcessFee;

    // 金重 (已含 1.18 損耗)
    let baseWt18k = conf.cWt + (mainStones * conf.sWt);
    let wt18k = baseWt18k * lossMultiplier;
    let wt14k = (baseWt18k * k14Ratio) * lossMultiplier;
    let wt10k = wt14k * 0.86; 
    let wtPt = (baseWt18k * ptRatio) * lossMultiplier;

    // 單純金屬料價
    let cost18k = wt18k * purity18K * goldPrice;
    let cost14k = wt14k * purity14K * goldPrice;
    let cost10k = wt10k * purity10K * goldPrice; 
    let costPt = wtPt * purityPT * ptPrice;

    // 終極總合計 (料價 + 鑽石 + 總工費)
    let final18k = cost18k + diaCost + totalLaborCost;
    let final14k = cost14k + diaCost + totalLaborCost;
    let final10k = cost10k + diaCost + totalLaborCost;
    let finalPt = costPt + diaCost + totalLaborCost;

    html += `<tr class='highlight'>
      <td>
        <span style="font-weight:bold; font-size:16px;">${totalStones} 顆</span><br>
        <div class="fee-text">總工費 $${totalLaborCost}</div><br>
        <span class="sub-text">($10/顆 + $600)</span>
      </td>
      <td>
        <span style="color:var(--text-main); font-weight:bold; font-size:16px;">${totalCt.toFixed(2)} ct</span><br>
        <div class="price-tag" style="background:#FDEBD0; border:none;">鑽價 $${Math.round(diaCost).toLocaleString()}</div>
      </td>
      <td>${len_cm.toFixed(2)} cm</td>
      <td>
        ${wt18k.toFixed(2)} g<br><span class="sub-text weight-unit">${formatWeight(wt18k)}</span>
        <div class="price-tag">料錢 $${Math.round(cost18k).toLocaleString()}</div><br>
        <div class="total-tag">總價 $${Math.round(final18k).toLocaleString()}</div>
      </td>
      <td>
        ${wt14k.toFixed(2)} g<br><span class="sub-text weight-unit">${formatWeight(wt14k)}</span>
        <div class="price-tag">料錢 $${Math.round(cost14k).toLocaleString()}</div><br>
        <div class="total-tag">總價 $${Math.round(final14k).toLocaleString()}</div>
      </td>
      <td style="background-color:#FDF9F1;">
        ${wt10k.toFixed(2)} g<br><span class="sub-text weight-unit">${formatWeight(wt10k)}</span>
        <div class="price-tag">料錢 $${Math.round(cost10k).toLocaleString()}</div><br>
        <div class="total-tag">總價 $${Math.round(final10k).toLocaleString()}</div>
      </td>
      <td>
        ${wtPt.toFixed(2)} g<br><span class="sub-text weight-unit">${formatWeight(wtPt)}</span>
        <div class="price-tag">料錢 $${Math.round(costPt).toLocaleString()}</div><br>
        <div class="total-tag">總價 $${Math.round(finalPt).toLocaleString()}</div>
      </td>
    </tr>`;

    html += "</table>";
    document.getElementById('result').innerHTML = html;
  }
  
  loadDefault();
</script>
</body>
</html>
