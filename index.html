<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ 網球手鏈精算系統 / Tennis Bracelet Calculator ✦</title>
<style>
  :root {
    --bg-color: #F5F0EB;       
    --card-bg: #FFFFFF;        
    --primary-color: #8D7B68;  
    --secondary-color: #A4907C; 
    --text-main: #4A4036;      
    --text-light: #7E7468;     
    --border-color: #E6E2DD;   
    --highlight-bg: #F9F6F0;   
    --highlight-text: #8D7B68; 
  }

  body { font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; padding: 20px 15px; background-color: var(--bg-color); color: var(--text-main); margin: 0; }
  .container { max-width: 950px; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(141, 123, 104, 0.15); margin: auto; }
  h2 { color: var(--primary-color); text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; font-size: 22px; margin-top: 0; }
  
  .reference-img-box { margin-bottom: 25px; background: #FCFAF8; padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); text-align: center; }
  
  /* 圖片尺寸統一縮小設定區塊 */
  .reference-img-box img { 
    width: 100%; 
    height: 120px; /* 將高度大幅縮小 */
    object-fit: contain; /* 確保圖片不變形，自動縮放適應高度 */
    border-radius: 8px; 
    margin-top: 10px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
    background-color: #FFFFFF; /* 補上白底，讓圖片兩側看起來乾淨 */
  }

  .input-group { margin-bottom: 25px; background: #FCFAF8; padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); }
  
  label { display: block; margin-top: 15px; font-weight: bold; color: var(--primary-color); font-size: 15px; }
  label:first-child { margin-top: 0; }
  select, input { width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box; border: 1px solid var(--secondary-color); border-radius: 6px; font-size: 16px; font-family: inherit; color: var(--text-main); font-weight: bold; }
  select { background-color: var(--highlight-bg); cursor: pointer; }
  input:focus, select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 5px rgba(141, 123, 104, 0.3); }
  
  .table-responsive { overflow-x: auto; margin-top: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  table { width: 100%; border-collapse: collapse; min-width: 850px; background-color: white; }
  th, td { border: 1px solid var(--border-color); padding: 14px 12px; text-align: center; font-size: 14.5px; }
  th { background-color: var(--secondary-color); color: white; font-weight: normal; }
  tr:nth-child(even) { background-color: #FAFAFA; }
  
  .highlight { font-weight: bold; color: var(--highlight-text); background-color: var(--highlight-bg) !important; }
  .en-text { font-size: 12px; opacity: 0.9; display: block; margin-top: 3px; font-weight: normal; }
  .sub-text { font-size: 12px; color: var(--text-light); font-weight: normal; display: block; margin-top: 4px; }
  .weight-unit { color: var(--primary-color); font-weight: bold; font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <h2>✦ 網球手鏈精算系統 ✦<br><span style="font-size:16px;">Tennis Bracelet Calculator</span></h2>
  
  <div class="reference-img-box">
    <span style="color: var(--primary-color); font-weight: bold; font-size: 14px;">鑲口款式參考 (左：經典原爪 / 右：牛頭四爪)</span>
    <img src="ViewCapture20260903_135952.jpg" alt="鑲口款式對照圖">
  </div>

  <div class="input-group">
    <label>選擇手鏈版型 <span class="en-text">(Select Bracelet Style)</span>
      <select id="modeSelect" onchange="loadDefault()">
        <option value="1pt">1分 滿鑽手鏈 / 0.01ct Tennis Bracelet</option>
        <option value="2pt">2分 滿鑽手鏈 / 0.02ct Tennis Bracelet</option>
        <option value="3pt">3分 滿鑽手鏈 / 0.03ct Tennis Bracelet</option>
        <option value="4pt">加密4分 滿鑽手鏈 / 0.04ct Tennis Bracelet</option>
        <option value="5pt">5分 滿鑽手鏈 / 0.05ct Tennis Bracelet</option>
        <option value="8pt">8分 滿鑽手鏈 / 0.08ct Tennis Bracelet</option>
        <option value="10pt">10分 滿鑽手鏈 / 0.10ct Tennis Bracelet</option>
        <option value="20pt">20分 滿鑽手鏈 / 0.20ct Tennis Bracelet</option>
      </select>
    </label>
    
    <label>目標總長度 <span class="en-text">(Target Length, cm) [輸入即自動精算]</span>
      <input type="number" id="tLen" step="0.01" oninput="calcFromLength()">
    </label>
  </div>

  <div class="table-responsive">
      <div id="result"></div>
  </div>

  <div class="reference-img-box" style="margin-top: 25px; margin-bottom: 0;">
    <span id="dynamicImgTitle" style="color: var(--primary-color); font-weight: bold; font-size: 14px;">實品款式參考</span>
    <img id="dynamicImg" src="" alt="實品圖">
  </div>
</div>

<script>
  const configs = {
    "1pt": { defaultLen: 16.08, cLen: 7.14, cWt: 0.585, cStones: 4, sLen: 1.7, sWt: 0.067, ctPerStone: 0.01 },
    "2pt": { defaultLen: 16.00, cLen: 7.93, cWt: 0.64, cStones: 4, sLen: 2.0, sWt: 0.073, ctPerStone: 0.02 },
    "3pt": { defaultLen: 16.17, cLen: 12.84, cWt: 1.01, cStones: 5, sLen: 2.2, sWt: 0.084, ctPerStone: 0.03 },
    "4pt": { defaultLen: 16.00, cLen: 10.4, cWt: 0.88, cStones: 4, sLen: 2.26, sWt: 0.10, ctPerStone: 0.04 },
    "5pt": { defaultLen: 16.37, cLen: 13.12, cWt: 1.22, cStones: 5, sLen: 2.5, sWt: 0.096, ctPerStone: 0.05 },
    "8pt": { defaultLen: 16.00, cLen: 15.5, cWt: 1.32, cStones: 5, sLen: 3.0, sWt: 0.14, ctPerStone: 0.08 },
    "10pt": { defaultLen: 19.51, cLen: 13.6, cWt: 4.24, cStones: 4, sLen: 3.3, sWt: 0.165, ctPerStone: 0.10 },
    "20pt": { defaultLen: 17.73, cLen: 20.13, cWt: 2.161, cStones: 5, sLen: 4.0, sWt: 0.25, ctPerStone: 0.20 }
  };
  
  const k14Ratio = 0.864;
  const ptRatio = 1.3;
  const gramToQian = 3.75; 

  function formatWeight(g) {
    let qianTotal = g / gramToQian;
    if (qianTotal >= 10) {
      let liang = Math.floor(qianTotal / 10);
      let qian = (qianTotal - (liang * 10)).toFixed(2);
      return `${liang}兩 ${qian}錢`;
    }
    return `${qianTotal.toFixed(2)} 錢`;
  }

  function updateDynamicImage(mode) {
    const titleEl = document.getElementById("dynamicImgTitle");
    const imgEl = document.getElementById("dynamicImg");

    if (mode === "1pt" || mode === "2pt") {
      titleEl.innerText = "實品款式參考 (1分與2分 滿鑽手鏈)";
      imgEl.src = "https://raw.githubusercontent.com/peter31love/-jewelry-calc-10045/2e8281e9b65064d7756bf22f865017a6d6e33a4b/80e08011-aa58-466b-aa71-a6cc7666a97f.png";
    } else if (mode === "3pt" || mode === "4pt") {
      titleEl.innerText = "實品款式參考 (3分與4分 滿鑽手鏈)";
      imgEl.src = "https://raw.githubusercontent.com/peter31love/-jewelry-calc-10045/c79307acba09bbd734576336013d24406dbc84d2/33.png";
    } else {
      titleEl.innerText = "實品款式參考 (5分以上 滿鑽手鏈)";
      imgEl.src = "https://raw.githubusercontent.com/peter31love/-jewelry-calc-10045/d234875912d79f4a6495ca9fc8bfe31e90a9ae06/777.bmp";
    }
  }

  function loadDefault() {
    let mode = document.getElementById('modeSelect').value;
    document.getElementById('tLen').value = configs[mode].defaultLen;
    calcFromLength();
  }

  function calcFromLength() {
    let mode = document.getElementById('modeSelect').value;
    let conf = configs[mode];
    let tLen_cm = parseFloat(document.getElementById('tLen').value) || 0;
    
    updateDynamicImage(mode);

    let actualSpace_mm = (tLen_cm * 10) - conf.cLen;
    let baseStones = Math.round(actualSpace_mm / conf.sLen);
    
    updateTable(baseStones, conf);
  }

  function updateTable(baseStones, conf) {
    let html = `<table>
      <tr>
        <th rowspan="2">排版情境<br><span class="en-text">Scenario</span></th>
        <th rowspan="2">總粒數<br><span class="en-text">Total Stones</span><br><span class="sub-text" style="color:#FFF;">(主鏈+扣頭 / Main+Clasp)</span></th>
        <th rowspan="2" style="background-color:#BCAAA4;">總鑽重<br><span class="en-text">Total Carat (ct)</span></th>
        <th rowspan="2">實際排版總長<br><span class="en-text">Actual Length (cm)</span></th>
        <th>18K金 淨重<br><span class="en-text">18K Net Wt.</span></th>
        <th style="background-color:#D7CCC8; color:#4A4036;">14K金 淨重<br><span class="en-text">14K Net Wt.</span></th>
        <th style="background-color:#9E9E9E;">PT950 淨重<br><span class="en-text">PT950 Net Wt.</span></th>
      </tr>
      <tr>
        <th>(克 g / 錢/兩)</th>
        <th style="background-color:#D7CCC8; color:#4A4036;">(克 g / 錢/兩)</th>
        <th style="background-color:#9E9E9E;">(克 g / 錢/兩)</th>
      </tr>`;

    const labels = [
      { cn: "減少一顆", en: "-1 Stone" },
      { cn: "標準排版", en: "Standard" },
      { cn: "增加一顆", en: "+1 Stone" }
    ];

    for(let i = -1; i <= 1; i++) {
      let mainStones = baseStones + i;
      let totalStones = mainStones + conf.cStones;
      let len_mm = conf.cLen + (mainStones * conf.sLen);
      let len_cm = len_mm / 10;
      let totalCt = totalStones * conf.ctPerStone;
      let wt18k = conf.cWt + (mainStones * conf.sWt);
      let wt14k = wt18k * k14Ratio;
      let wtPt = wt18k * ptRatio;

      let label = labels[i+1];
      let rowClass = i === 0 ? "class='highlight'" : "";
      
      html += `<tr ${rowClass}>
        <td>${label.cn}<br><span class="sub-text">${label.en}</span></td>
        <td>${totalStones} <span class="sub-text">pcs</span></td>
        <td style="color:var(--text-main); font-weight:bold; font-size:16px;">${totalCt.toFixed(2)} ct</td>
        <td>${len_cm.toFixed(2)} cm</td>
        <td>${wt18k.toFixed(2)} g<br><span class="sub-text weight-unit">${formatWeight(wt18k)}</span></td>
        <td>${wt14k.toFixed(2)} g<br><span class="sub-text weight-unit">${formatWeight(wt14k)}</span></td>
        <td>${wtPt.toFixed(2)} g<br><span class="sub-text weight-unit">${formatWeight(wtPt)}</span></td>
      </tr>`;
    }
    html += "</table>";
    document.getElementById('result').innerHTML = html;
  }
  
  loadDefault();
</script>
</body>
</html>
